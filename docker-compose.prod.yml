version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: template_review_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: template_review_web
    env_file:
      - .env.production
    environment:
      WAIT_FOR_DB: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
