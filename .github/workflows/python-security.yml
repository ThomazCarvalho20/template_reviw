name: Python Security & Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install black ruff bandit pip-audit pytest
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r .

      - name: pip-audit dependency scan
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip-audit -r requirements-dev.txt
          fi

      - name: Run tests
        run: |
          if [ -f manage.py ]; then
            python manage.py test -v 2
          elif [ -d tests ]; then
            pytest
          else
            echo "No tests found."
          fi

      - name: Django deploy checks
        env:
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
        run: |
          if [ -f manage.py ]; then
            if [ -n "$DJANGO_SETTINGS_MODULE" ]; then
              python manage.py check --deploy --fail-level WARNING
            else
              echo "manage.py found, but DJANGO_SETTINGS_MODULE secret is not set."
              echo "Set repository secret DJANGO_SETTINGS_MODULE to enforce deploy checks in CI."
              exit 1
            fi
          else
            echo "No Django project yet (manage.py not found). Skipping deploy checks."
          fi
