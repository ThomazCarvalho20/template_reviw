{% if is_paginated %}<nav class="inline-actions" aria-label="Paginação"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_previous %}<a class="button button-outline" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="button button-outline" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}">Próxima</a>{% endif %}</nav>{% endif %}
